name: release

# Builds the desktop app for macOS (Apple Silicon) and Windows (x64), signs the
# updater artifacts, and publishes installers + latest.json to a GitHub Release
# whenever a `v*` tag is pushed. A manual run (workflow_dispatch) just builds
# and stores the artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            friendly_os: macOS
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            friendly_os: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Stage self-contained backend
        shell: bash
        run: |
          DSH_VERSION="$(cat dsh-version)"
          if [ "$RUNNER_OS" = "macOS" ]; then
            ./scripts/bundle-backend.sh
          else
            # Windows: stage node.exe + a win32-native install of the dsh CLI.
            mkdir -p resources/backend
            cp "$(node -e 'process.stdout.write(process.execPath)')" resources/backend/node.exe
            cd resources/backend
            npm init -y >/dev/null 2>&1
            npm install "@deepseek-ai/dsh@${DSH_VERSION}"
            cd ../..
          fi

      - name: Build Tauri app (signed updater artifacts)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run build

      - name: Collect and rename release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          BUNDLE="src-tauri/target/release/bundle"
          BASE="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          mkdir -p dist-assets

          if [ "$RUNNER_OS" = "macOS" ]; then
            # Updater bundle + signature (what latest.json points at).
            UPDATER="dist-assets/DeepSeek.Harness_${VERSION}_aarch64.app.tar.gz"
            cp "$BUNDLE"/macos/*.app.tar.gz "$UPDATER"
            cp "$BUNDLE"/macos/*.app.tar.gz.sig "$UPDATER.sig"
            # Regular installers.
            (cd "$BUNDLE/macos" && ditto -c -k "DeepSeek Harness.app" \
              "$OLDPWD/dist-assets/DeepSeek.Harness_${VERSION}_arm64.app.zip")
            cp "$BUNDLE"/dmg/*.dmg "dist-assets/DeepSeek.Harness_${VERSION}_aarch64.dmg" || echo "no dmg produced"
            # Platform fragment for latest.json.
            python3 scripts/updater-manifest.py fragment darwin-aarch64 \
              "$BASE/DeepSeek.Harness_${VERSION}_aarch64.app.tar.gz" \
              "$UPDATER.sig" \
              dist-assets/latest-darwin-aarch64.json
          else
            # Updater bundle (NSIS) + signature.
            INST="dist-assets/DeepSeek.Harness_${VERSION}_x64-setup.exe"
            cp "$BUNDLE"/nsis/*-setup.exe "$INST"
            cp "$BUNDLE"/nsis/*-setup.exe.sig "$INST.sig"
            cp "$BUNDLE"/msi/*.msi "dist-assets/DeepSeek.Harness_${VERSION}_x64_en-US.msi" || echo "no msi produced"
            python3 scripts/updater-manifest.py fragment windows-x86_64 \
              "$BASE/DeepSeek.Harness_${VERSION}_x64-setup.exe" \
              "$INST.sig" \
              dist-assets/latest-windows-x86_64.json
          fi
          ls -la dist-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.friendly_os }}
          path: dist-assets/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist-assets
          merge-multiple: true

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/updater-manifest.py merge "$VERSION" dist-assets/latest.json dist-assets/latest-*.json
          # Keep the release clean: drop the inlined signatures and fragments.
          rm -f dist-assets/*.sig dist-assets/latest-*.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*
          generate_release_notes: true
